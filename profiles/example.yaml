# 同一份档案的 YAML 版本（需要：pip install 'prompt-smith[yaml]'）
# 字段含义与 example.json 完全一致，选你顺手的格式即可。
name: anime-general
description: 通用动漫立绘风格示例档案（YAML 版）
trigger: anime style

quality:
  - masterpiece
  - best quality
  - absurdres
  - very aesthetic
  - highly detailed

negative_base:
  - lowres
  - bad anatomy
  - bad hands
  - extra limbs
  - text
  - error
  - missing fingers
  - cropped
  - worst quality
  - low quality
  - jpeg artifacts
  - signature
  - watermark
  - blurry
  - ugly
  - deformed

slots:
  subject:
    default: 1girl, solo
    tags: [1girl, solo, 1boy, 2girls]
  outfit:
    default: ""
    tags: [hanfu, evening dress, casual wear, armor]
  scene:
    default: ""
    tags: [bedroom, ballroom, forest, city street, library]
  pose:
    default: looking at viewer
    tags: [standing, sitting, lying, kneeling]
  expression:
    default: soft smile
    tags: [smile, serious, surprised, closed eyes]
  framing:
    default: full body
    tags: [full body, upper body, cowboy shot, portrait]

required:
  - 1girl

forbidden:
  - lowres
  - blurry
  - watermark
  - signature

conflicts:
  - a: daylight
    b: candlelight
    reason: 两套光源互斥，画面会平
  - a: full body
    b: close-up
    reason: 构图范围冲突，模型容易画成半身

render:
  adapter: comfyui
  comfyui_url: http://127.0.0.1:8188
  checkpoint: your_sdxl_checkpoint.safetensors
  lora:
    name: your_style_lora.safetensors
    strength: 0.8
  width: 832
  height: 1216
  steps: 30
  cfg: 7.0

quality_gate:
  brightness: [110, 175]
  contrast_min: 60

safety:
  adult_only: true
  max_tags: 75
